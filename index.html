<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zwierz Obywatel – Zdrowie Twojego Pupila</title>
    <!-- Import czcionki Alan Sans / Montserrat / Inter jako elegancki sans-serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', 'Alan Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #080a14 url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=2000&auto=format&fit=crop') no-repeat center center/cover;
            color: #ffffff;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Przyciemniająca nakładka na tło */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(8, 10, 20, 0.75) 0%, rgba(5, 6, 12, 0.95) 100%);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            padding: 20px;
            max-width: 800px;
            width: 100%;
        }

        /* Logo */
        .logo {
            width: 180px;
            max-width: 60vw;
            height: auto;
            margin-bottom: 25px;
            filter: drop-shadow(0px 4px 20px rgba(40, 80, 220, 0.25));
        }

        /* Tytuły */
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.subtitle {
            font-size: 1.25rem;
            font-weight: 300;
            font-style: italic;
            color: #c0cbef;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        /* Licznik */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .timer-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px 15px;
            min-width: 110px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .timer-box:hover {
            transform: translateY(-3px);
            border-color: rgba(90, 130, 255, 0.4);
        }

        .number {
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8fa0dd;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; letter-spacing: 2px; }
            p.subtitle { font-size: 1rem; }
            .countdown { gap: 10px; }
            .timer-box { min-width: 75px; padding: 15px 8px; }
            .number { font-size: 1.8rem; }
            .label { font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="container">
        <!-- Logo -->
        <img src="logo.png" alt="Zwierz Obywatel Logo" class="logo">

        <!-- Nagłówki -->
        <h1>ZWIERZ OBYWATEL</h1>
        <p class="subtitle">Zdrowie Twojego Pupila</p>

        <!-- Licznik -->
        <div class="countdown">
            <div class="timer-box">
                <div class="number" id="days">200</div>
                <div class="label">Dni</div>
            </div>
            <div class="timer-box">
                <div class="number" id="hours">00</div>
                <div class="label">Godz</div>
            </div>
            <div class="timer-box">
                <div class="number" id="minutes">00</div>
                <div class="label">Min</div>
            </div>
            <div class="timer-box">
                <div class="number" id="seconds">00</div>
                <div class="label">Sek</div>
            </div>
        </div>
    </div>

    <script>
        // Data docelowa: 200 dni od dzisiaj
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 200);

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById('days').innerText = "0";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours < 10 ? '0' + hours : hours;
            document.getElementById('minutes').innerText = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('seconds').innerText = seconds < 10 ? '0' + seconds : seconds;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
        </script>
</body>
</html>
