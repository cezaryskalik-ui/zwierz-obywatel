<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zwierz Obywatel – Zdrowie Twojego Pupila</title>
    <!-- Import czcionki Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Ciemnogranatowe tło z prześwitem niebieskiego */
            background: radial-gradient(circle at center, #0f2042 0%, #040814 100%);
            color: #ffffff;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Gwiazdy (kropki w tle) */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.9), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 230px 190px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 300px 60px, rgba(255,255,255,0.7), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 370px 150px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 450px 80px, rgba(255,255,255,0.9), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 500px 500px;
            opacity: 0.6;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            padding: 20px;
            max-width: 900px;
            width: 100%;
        }

        /* Logo */
        .logo {
            width: 720px;
            max-width: 90vw;
            height: auto;
            margin-bottom: 35px;
            filter: drop-shadow(0px 4px 25px rgba(30, 100, 255, 0.3));
        }

        /* Licznik */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .timer-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px 15px;
            min-width: 110px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .timer-box:hover {
            transform: translateY(-3px);
            border-color: rgba(90, 130, 255, 0.4);
        }

        .number {
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8fa0dd;
        }

        @media (max-width: 600px) {
            .countdown { gap: 10px; }
            .timer-box { min-width: 75px; padding: 15px 8px; }
            .number { font-size: 1.8rem; }
            .label { font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <!-- Kropki jako gwiazdy w tle -->
    <div class="stars"></div>

    <div class="container">
        <!-- Logo -->
        <img src="logo.png" alt="Zwierz Obywatel Logo" class="logo">

        <!-- Licznik -->
        <div class="countdown">
            <div class="timer-box">
                <div class="number" id="days">00</div>
                <div class="label">Dni</div>
            </div>
            <div class="timer-box">
                <div class="number" id="hours">00</div>
                <div class="label">Godz</div>
            </div>
            <div class="timer-box">
                <div class="number" id="minutes">00</div>
                <div class="label">Min</div>
            </div>
            <div class="timer-box">
                <div class="number" id="seconds">00</div>
                <div class="label">Sek</div>
            </div>
        </div>
    </div>

    <script>
        // Stała data docelowa: 133 dni i 23 godziny od chwili zapisu
        const targetDate = new Date("2027-01-25T23:17:38").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById('days').innerText = "0";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours < 10 ? '0' + hours : hours;
            document.getElementById('minutes').innerText = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('seconds').innerText = seconds < 10 ? '0' + seconds : seconds;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
